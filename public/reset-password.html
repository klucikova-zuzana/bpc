<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>BizPartnerCheck – Reset password</title>
</head>
<body>
  <!-- SCRUM-15: without a token this page asks for the e-mail address ("Forgot password");
       with #token=... from the e-mail it asks for the new password. -->
  <h1 id="title"></h1>

  <form id="request-form" hidden>
    <label><span id="email-label"></span><br><input type="email" name="email" required autocomplete="email"></label>
    <p><button type="submit" id="request-button"></button></p>
  </form>

  <form id="confirm-form" hidden>
    <label><span id="password-label"></span><br><input type="password" name="password" required minlength="12" maxlength="128" autocomplete="new-password"></label><br>
    <label><span id="repeat-label"></span><br><input type="password" name="repeat" required autocomplete="new-password"></label>
    <p><button type="submit" id="confirm-button"></button></p>
  </form>

  <p id="message" role="status"></p>

  <script>
    const texts = {
      en: {
        title: 'Reset password',
        email: 'E-mail address',
        send: 'Send reset link',
        sent: 'If an active account uses this address, we have sent a reset link. It works for 30 minutes.',
        password: 'New password (at least 12 characters)',
        repeat: 'Repeat new password',
        save: 'Set new password',
        mismatch: 'The two passwords are not the same.',
        done: 'Your password has been changed. You can now log in with the new password.',
        INVALID_LINK: 'This link is invalid, already used or expired. Please request a new one.',
        PASSWORD_TOO_SHORT: 'The password must have at least 12 characters.',
        PASSWORD_TOO_LONG: 'The password can have at most 128 characters.',
        failed: 'Something went wrong. Please try again.',
      },
      de: {
        title: 'Passwort zurücksetzen',
        email: 'E-Mail-Adresse',
        send: 'Link zum Zurücksetzen senden',
        sent: 'Wenn ein aktives Konto diese Adresse verwendet, haben wir einen Link gesendet. Er gilt 30 Minuten.',
        password: 'Neues Passwort (mindestens 12 Zeichen)',
        repeat: 'Neues Passwort wiederholen',
        save: 'Neues Passwort speichern',
        mismatch: 'Die beiden Passwörter stimmen nicht überein.',
        done: 'Ihr Passwort wurde geändert. Sie können sich jetzt mit dem neuen Passwort anmelden.',
        INVALID_LINK: 'Dieser Link ist ungültig, bereits verwendet oder abgelaufen. Bitte fordern Sie einen neuen an.',
        PASSWORD_TOO_SHORT: 'Das Passwort muss mindestens 12 Zeichen haben.',
        PASSWORD_TOO_LONG: 'Das Passwort darf höchstens 128 Zeichen haben.',
        failed: 'Etwas ist schiefgegangen. Bitte versuchen Sie es erneut.',
      },
    };
    const lang = navigator.language.toLowerCase().startsWith('de') ? 'de' : 'en';
    const t = texts[lang];
    document.documentElement.lang = lang;
    document.title = `BizPartnerCheck – ${t.title}`;
    for (const [id, key] of [['title', 'title'], ['email-label', 'email'], ['request-button', 'send'],
      ['password-label', 'password'], ['repeat-label', 'repeat'], ['confirm-button', 'save']]) {
      document.getElementById(id).textContent = t[key];
    }

    const message = document.getElementById('message');
    const token = new URLSearchParams(location.hash.slice(1)).get('token');
    // Remove the token from the address bar and browser history.
    if (token) history.replaceState(null, '', location.pathname);

    const requestForm = document.getElementById('request-form');
    const confirmForm = document.getElementById('confirm-form');
    (token ? confirmForm : requestForm).hidden = false;

    const post = (path, body) =>
      fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });

    requestForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      const response = await post('/api/password-reset', { email: requestForm.email.value }).catch(() => null);
      message.textContent = response?.ok ? t.sent : t.failed;
      if (response?.ok) requestForm.hidden = true;
    });

    confirmForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      if (confirmForm.password.value !== confirmForm.repeat.value) {
        message.textContent = t.mismatch;
        return;
      }
      const response = await post('/api/password-reset/confirm', { token, password: confirmForm.password.value }).catch(() => null);
      if (response?.status === 204) {
        confirmForm.hidden = true;
        message.textContent = t.done;
      } else {
        const body = await response?.json().catch(() => ({}));
        message.textContent = t[body?.error] ?? t.failed;
      }
    });
  </script>
</body>
</html>
