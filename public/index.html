<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BizPartnerCheck</title>
</head>
<body>
  <h1>BizPartnerCheck</h1>
  <p>API status: <span id="status">checking…</span></p>
  <script>
    fetch('/api/health')
      .then((response) => response.json())
      .then((body) => { document.getElementById('status').textContent = body.status; })
      .catch(() => { document.getElementById('status').textContent = 'unreachable'; });
  </script>
</body>
</html>
